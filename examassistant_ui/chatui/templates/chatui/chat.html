<header class="chat__header" style="display:flex;gap:16px;align-items:baseline">
  <h1>ExamAssistant · Chat</h1>
  <nav style="margin-left:auto;display:flex;gap:12px">
    <a href="{% url 'chat' %}">Chat</a>
    <a href="{% url 'generator' %}">↔ Generator</a>
  </nav>
</header>

{% load static %}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ExamAssistant · Chat</title>
    <link rel="stylesheet" href="{% static 'chatui/styles.css' %}" />
  </head>
  <body>
    <main class="container">
      <section class="chat">
        <header class="chat__header">
          <h1>ExamAssistant · Chat</h1>
          <small>minimal: Text + PDF</small>
        </header>

        <div id="messages" class="chat__messages"></div>

        <form id="form" class="chat__form">
          <div class="row">
            <label class="file">
              <input id="file" type="file" accept="application/pdf" />
              <span>PDF anhängen</span>
            </label>
            <span id="uploadStatus" class="muted"></span>
          </div>

          <div class="row">
            <textarea id="input" placeholder="Frag mich etwas…"></textarea>
            <button id="send" type="submit">Senden</button>
          </div>
          {% csrf_token %}
        </form>
      </section>
    </main>

    <script>
      function getCookie(name){const v=document.cookie.match('(?:^|; )'+name+'=([^;]*)');return v?decodeURIComponent(v[1]):null}
      window.CSRF_TOKEN = getCookie('csrftoken');
    </script>
    <!-- Cache-Busting via Version-Query + sicheres Laden via static -->
    <script defer src="{% static 'chatui/chat.js' %}?v=20250920-2"></script>
  </body>
</html>
