{% load static %}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detaillierte Analyse · ExamAssistant</title>
    <link rel="stylesheet" href="{% static 'chatui/styles.css' %}" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 40px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 30px 40px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }

      h2 {
        border-bottom: 2px solid #007bff33;
        padding-bottom: 4px;
        margin-top: 30px;
        font-size: 18px;
      }

      .metric {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }

      .task {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        margin-top: 14px;
        background: #fafafa;
      }

      .task h3 {
        margin-top: 0;
      }

      .footer {
        text-align: center;
        margin-top: 30px;
      }

      .btn {
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
        text-decoration: none;
      }

      .btn:hover {
        background: #0056b3;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>📊 Detaillierte Analyse</h1>
      <p id="summaryInfo">Lade Ergebnisse...</p>

      <h2>📖 Lesbarkeitsanalyse</h2>
      <div id="readabilitySection"></div>

      <h2>⚖️ Aufgabenanalyse</h2>
      <div id="tasksSection"></div>

      <h2>🔗 Gesamtbewertung</h2>
      <div id="similaritySection"></div>

      <div class="footer">
        <a href="/compare" class="btn">⬅️ Zurück zum Vergleich</a>
      </div>
    </div>

    <script>
      async function loadAnalysis() {
        const params = new URLSearchParams(window.location.search);
        const chat_id = params.get("chat_id") || "default";
        const run_id = params.get("run_id");
        if (!run_id) {
          document.getElementById("summaryInfo").textContent =
            "❌ Keine Analyse-ID angegeben.";
          return;
        }

        try {
          const res = await fetch(`/analysis/${chat_id}/${run_id}/summary.json`);
          const data = await res.json();

          document.getElementById("summaryInfo").textContent =
            "Analyse erfolgreich geladen.";

          const r = data.readability_metrics || {};
          let rHtml = "";
          for (const [k, v] of Object.entries(r)) {
            rHtml += `<div class="metric"><span>${k}</span><span>${v}</span></div>`;
          }
          document.getElementById("readabilitySection").innerHTML = rHtml;

          const t = data.tasks || [];
          let tHtml = "";
          t.forEach((task) => {
            tHtml += `
              <div class="task">
                <h3>${task.task_id}</h3>
                <b>Feedback:</b><br>${task.feedback || "(kein Feedback)"}<br><br>
                <i>Ähnlichkeit: ${(task.similarity * 100).toFixed(2)}%</i>
              </div>`;
          });
          document.getElementById("tasksSection").innerHTML =
            tHtml || "<p>Keine Aufgaben gefunden.</p>";

          const s = data.similarity_score || 0;
          document.getElementById(
            "similaritySection"
          ).innerHTML = `<p>Gesamtähnlichkeit: <b>${(s * 100).toFixed(2)}%</b></p>`;
        } catch (err) {
          document.getElementById("summaryInfo").textContent =
            "❌ Fehler beim Laden der Analyse.";
        }
      }

      loadAnalysis();
    </script>
  </body>
</html>
